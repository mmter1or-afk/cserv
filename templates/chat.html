{% extends "base.html" %}
{% block title %}Чат — Hades{% endblock %}
{% block content %}
<section class="panel-card chat-card standalone-chat">
  <button class="chat-header" type="button" aria-controls="chat-container" aria-expanded="true"><span>Общий чат</span><span class="toggle-icon">⌄</span></button>
  <div id="chat-container" class="chat-container"><div id="chat-messages" class="chat-messages" aria-live="polite"></div><div class="chat-input-row"><label class="sr-only" for="message-input">Сообщение</label><input type="text" id="message-input" maxlength="800" placeholder="Напишите сообщение"><button id="send-btn" class="button primary" type="button">Отправить</button></div></div>
</section>
<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
{% endblock %}
