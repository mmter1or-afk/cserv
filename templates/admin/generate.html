{% extends "base.html" %}
{% block title %}Новый ключ — Hades{% endblock %}
{% block content %}
<section class="key-page reveal">
    <div class="section-intro compact">
        <p class="eyebrow">Ключ доступа</p>
        <h1>Создание нового срока подписки.</h1>
    </div>
    <div class="form-card key-card">
        {% if key %}
            <div class="key-result">
                <span class="mono-label">Новый ключ</span>
                <strong>{{ key }}</strong>
                <p>{{ days }} дн.</p>
            </div>
            <a class="button button-plain full" href="/admin/panel">Вернуться в панель</a>
        {% else %}
            {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
            <form method="POST" class="stack-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="field">Срок, дней<input type="number" name="days" min="1" max="3650" required></label>
                <button type="submit" class="button button-dark full">Создать ключ</button>
            </form>
        {% endif %}
    </div>
</section>
{% endblock %}
