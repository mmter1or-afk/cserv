<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hades Cheat{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">Hades</a>
            <div class="nav-links">
                <a href="/">Главная</a>
                {% if session.user_id %}
                    <a href="/panel">Личный кабинет</a>
                    <a href="/logout">Выйти</a>
                {% else %}
                    <a href="/login">Вход</a>
                    <a href="/register">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 Hades. Все права защищены.</p>
    </footer>
</body>
</html>
