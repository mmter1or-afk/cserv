<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Закрытый портал Hades для регистрации по ключу, управления подпиской, профилем и общим чатом участников.">
    <meta property="og:title" content="Hades Access Portal">
    <meta property="og:description" content="Портал доступа с регистрацией по ключу, профилем, статусом подписки и чатом.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Hades Access Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="site-header">
        <nav class="nav" aria-label="Основная навигация">
            <a href="/" class="brand" aria-label="Hades — главная">
                <span class="brand-mark" aria-hidden="true">H</span>
                <span class="brand-copy"><strong>Hades</strong><small>Access Portal</small></span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-item">Обзор</a>
                {% if session.user_id %}
                    <a href="/panel" class="nav-item">Кабинет</a>
                    <a href="/chat" class="nav-item">Чат</a>
                    <form method="POST" action="/logout" class="inline-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button class="nav-item link-button" type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a href="/login" class="nav-item">Вход</a>
                    <a class="button button-small button-dark" href="/register">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main id="main" class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div>
            <strong>Hades</strong>
            <span>Закрытая зона для действующих участников.</span>
        </div>
        <a href="/">Обзор</a>
    </footer>
</body>
</html>
